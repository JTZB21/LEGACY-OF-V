<style>
/* Layout: sticky header, tab content, bottom nav; combat + mini-game as overlays. Single dark look (gold frames, crimson actions) by choice. */
:root{
  --bg:#050507; --panel:#0d0d12; --panel2:#151821; --slate:#1b2130; --gold:#d9a53a; --gold2:#f4cd5d;
  --crim:#8c1b2b; --crim2:#ad2a3d; --parch:#dcc188; --ink:#2a1c10; --fg:#f2e9d6; --dim:#a39c8c;
  --hp:#d9443c; --mp:#3f8cff; --st:#3fbf6a;
  --f-logo:'Cinzel',Georgia,serif; --f-ui:'Montserrat',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-ui);margin:0;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:980px;margin:0 auto}
button{font:700 .86rem var(--f-ui);color:var(--gold2);background:var(--crim);border:1.5px solid var(--gold);border-radius:9px;padding:9px 12px;cursor:pointer;min-height:42px;text-transform:uppercase;letter-spacing:.03em;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
button.alt{background:var(--slate);color:var(--fg)}
button.ghost{background:transparent;color:var(--gold2)}
button.big{font-size:1.05rem;min-height:52px}
button:disabled{opacity:.38;cursor:default}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,select,textarea{font:600 1rem var(--f-ui);background:var(--parch);color:var(--ink);border:1.5px solid var(--gold);border-radius:9px;padding:10px;box-sizing:border-box;width:100%;min-width:0}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.04em}
h2{font-size:.95rem;color:var(--gold2);text-transform:uppercase;text-align:center}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .sm{font-size:.82rem}
.logo{font-family:var(--f-logo);font-weight:800;color:var(--crim2);text-shadow:0 0 1px var(--gold),0 1px 0 #000;letter-spacing:.02em}

/* header */
#hud{padding:10px 16px 8px;border-bottom:1.5px solid var(--gold);background:var(--panel)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hrow h1{font-size:1.15rem;color:var(--gold2)}
.cur{display:flex;gap:6px;flex-wrap:wrap}
.cur span{font:700 .78rem var(--f-ui);border:1.5px solid var(--gold);border-radius:8px;padding:3px 8px;background:#000}
.cur b.g{color:var(--gold2)} .cur b.m{color:#5aa8ff} .cur b.e{color:#7ee08f}
.cc{color:var(--hp);font-weight:800}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.bar{height:9px;background:#000;border:1px solid #3a3326;border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--hp);transition:width .2s}
.bar.mp i{background:var(--mp)} .bar.st i{background:var(--st)} .bar.xp i{background:var(--gold)}
.blabel{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);font-weight:700}

#view{flex:1;overflow-y:auto;padding:14px 16px 20px;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.lock{opacity:.6}
.card .t{font-weight:800;color:var(--gold2);text-align:center}
.card .d{font-size:.8rem;color:var(--dim);text-align:center}
.card .meta{font-size:.75rem;font-weight:700;text-align:center}
.btns{display:flex;gap:8px} .btns>button{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:3px 0;border-bottom:1px solid #1d1a14}
.kv:last-child{border-bottom:0}
.kv b{text-align:right}
.parch{background:var(--parch);color:var(--ink);border-color:#a8772a}
.parch h2{color:var(--crim)}
.log{display:flex;flex-direction:column;gap:6px}
.log p{margin:0;padding:6px 10px;border-left:3px solid var(--crim);background:rgba(0,0,0,.06);font-size:.88rem;border-radius:4px}
.log p:first-child{border-left-color:#2c6fd6}
.pill{display:inline-block;font:700 .7rem var(--f-ui);padding:2px 7px;border:1px solid currentColor;border-radius:10px}
.stages{list-style:none;margin:0;padding:0;font-size:.85rem}
.stages li{padding:3px 0;color:var(--dim)} .stages li.on{color:var(--gold2)}

/* nav */
#nav{display:flex;overflow-x:auto;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1.5px solid var(--gold)}
#nav button{flex:1 0 auto;min-width:84px;background:var(--slate);color:var(--fg);font-size:.78rem}
#nav button.on{background:var(--crim);color:var(--gold2)}

/* creation */
.ctabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctabs button{background:var(--slate);color:var(--fg);font-size:.78rem;padding:8px 4px}
.ctabs button.on{background:var(--crim);color:var(--gold2)}
.fate{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.fate{grid-template-columns:1fr}}
.roll{text-align:center}
.roll .rn{font-size:1.9rem;font-weight:800;color:var(--fg)}
.roll .rr{font-weight:800;letter-spacing:.08em}
.roll ul{text-align:left;margin:6px 0 0;padding-left:18px;font-size:.88rem}
.summary{background:var(--parch);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;border:1.5px solid #a8772a}
.summary b{color:var(--crim)}
.flash{animation:fl .5s}
@keyframes fl{0%{transform:scale(.92);opacity:.3}100%{transform:none;opacity:1}}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov .box{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.ov .box h2{font-size:1.15rem}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-weight:800;font-size:.82rem}
.odds div{display:flex;justify-content:space-between}

/* combat */
.unit{background:var(--panel2);border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.unit .nm{display:flex;justify-content:space-between;font-weight:800;gap:8px}
.intent{font-weight:800;font-size:.85rem;padding:5px 9px;border-radius:7px;background:#000;border:1px solid var(--gold);text-align:center}
.intent.warn{border-color:var(--hp);color:#ff8a7a}
.chips{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts button{font-size:.72rem;padding:6px 4px;min-height:48px;line-height:1.15}
.acts button small{display:block;font-weight:600;color:var(--fg);opacity:.8;text-transform:none;font-size:.68rem}
.acts button.sk{background:#2a1450}
.clog{background:var(--parch);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:3px;max-height:150px;overflow-y:auto}
.clog p{margin:0} .clog p:first-child{font-weight:700}

/* mini-games */
.meter{position:relative;height:38px;background:#000;border:1.5px solid var(--gold);border-radius:8px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(63,191,106,.35)}
.zone.p{background:rgba(244,205,93,.65)}
.pip{position:absolute;top:0;bottom:0;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
.mgbig{font-size:1.6rem;font-weight:800;text-align:center;color:var(--gold2);min-height:2.2rem}
.syms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.syms button{font-size:1.5rem;min-height:56px}
.grade{font:800 3.2rem var(--f-logo);text-align:center}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--crim);border:1.5px solid var(--gold);color:var(--gold2);font-weight:700;padding:8px 14px;border-radius:10px;z-index:30;max-width:90%;font-size:.85rem;text-align:center}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1d1a14}
.toggle span{font-size:.86rem} .toggle small{display:block;color:var(--dim);font-size:.75rem}
.toggle button{min-width:72px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <main id="view"></main>

</div>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast" hidden></div>

 {id:'courier',n:'Courier',st:'spd',b:14,k:.6,req:20,rank:0,d:'Run letters and parcels between villages.'},
 {id:'scribe',n:'Scribe',st:'int',b:16,k:.7,req:30,rank:0,d:'Copy contracts and old scrolls for the guild hall.'},
 {id:'guard',n:'Caravan Guard',st:'dur',b:30,k:.8,req:45,rank:1,d:'Escort merchant wagons through the Whisperwood.'},
 {id:'apoth',n:'Apothecary Assistant',st:'ctl',b:45,k:.9,req:70,rank:1,d:'Brew remedies. Sometimes you get to keep a Healing Draught.'},
 {id:'tutor',n:'Arcane Tutor',st:'mag',b:70,k:1,req:110,rank:2,d:'Teach noble children their first spells.'},
 {id:'chaplain',n:'Vigil Chaplain',st:'spr',b:110,k:1.05,req:170,rank:2,d:'Lead the knights in prayer and keep their spirits steady.'},

 {id:'archmage',n:'Court Archmage',st:'mag',b:450,k:1.4,req:520,rank:5,d:'Advise the crown on matters of magic and war.'}
];
const JOBLV=[0,10,25,50,100,200];
const JOBT=['Trainee','Regular','Skilled','Senior','Master','Legend'];
/* ===== CORE ===== */
const KEY='vigil_save_v3';
let S,C=null,MG=null,tab='you',ctab='race';
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);if(Math.abs(n)<1e4)return String(n);const u=['','K','M','B','T'];let i=0,v=n;while(Math.abs(v)>=1000&&i<4){v/=1000;i++}return v.toFixed(v<100?1:0)+u[i]};
const byId=(list,id)=>list.find(x=>x.id===id);
const A=()=>S.assist;

function freshSave(){
  S={v:3,merit:50,lp:{},codex:{race:{},bl:{},mag:{},trait:{}},assist:{},hall:[],lives:0,phase:'create',fate:null,P:null,last:Date.now()};
  newFate();
}
/* ---- fate rolling ---- */
function rollRarity(){let t=0,r=Math.random()*100;for(let i=0;i<RAR.length;i++){t+=RAR[i].w;if(r<t)return i}return 0}
function rollFrom(list){
  let r=rollRarity(),pool;
  while(r>=0&&!(pool=list.filter(x=>x.r===r)).length)r--;
  return pick(pool).id;
}
function freeSpins(){return 10+(S.lp.favor||0)*2}
function newFate(){
  const g=pick(['Male','Female']),f={name:nameFor(g),gender:g,spins:{},back:null};
  CATS.forEach(([k,,list])=>{f[k]=rollFrom(list);f.spins[k]=freeSpins();discover(k,f[k],true)});
  S.fate=f;S.phase='create';
}
function discover(k,id,quiet){
  if(S.codex[k][id])return 0;
  S.codex[k][id]=1;
  const list=CATS.find(c=>c[0]===k)[2],it=byId(list,id),m=MERIT_CODEX[it.r];
  S.merit+=m;
  if(!quiet)toast(`Codex discovery: ${it.n} (+${m} Merit)`);
  return m;
}
function spinCost(k){if(A().spins)return 0;return S.fate.spins[k]>0?0:25}
function spin(k){
  const c=spinCost(k);
  if(c&&S.merit<c)return false;
  if(!A().spins){if(S.fate.spins[k]>0)S.fate.spins[k]--;else S.merit-=c}
  const list=CATS.find(x=>x[0]===k)[2];
  S.fate[k]=rollFrom(list);discover(k,S.fate[k]);
  const it=byId(list,S.fate[k]);
  if(it.r>=4)toast(`${RAR[it.r].n}! ${it.n}`);
  return true;
}
function chooseExact(k,id){
  const list=CATS.find(x=>x[0]===k)[2],it=byId(list,id),c=EXACT_COST[it.r];
  if(it.r>=7||S.merit<c)return;
  S.merit-=c;S.fate[k]=id;discover(k,id);
}
/* ---- life ---- */
function beginLife(backId){
  const f=S.fate,b=byId(BACKS,backId),head=(S.lp.head||0)*4;
  const raw={};STK.forEach(k=>raw[k]=10+head+(b.raw[k]||0));
  S.P={name:f.name||'Nameless',race:f.race,bl:f.bl,mag:f.mag,trait:f.trait,back:backId,raw,
    mast:{},tier:{},mxp:0,mlv:1,rxp:0,rank:0,gold:b.gold,energy:10,ectr:0,drill:'str',
    wpn:b.wpn||null,foc:null,owned:b.wpn?[b.wpn]:[],pot:{hp:2,mp:1},jobs:{},bosses:{},titles:[],streak:{},wins:0,log:[],hp:-1,mp:-1,
    gender:f.gender||'Male',age:0,life:rollLife(f.race),gen:1,acts:4,dead:false,ev:null,people:[]};
  S.P.people=makeFamily(S.P);
  S.lives++;S.phase='play';tab='you';
  const P=S.P;P.hp=maxHp();P.mp=maxMp();P.energy=maxEnergy();
  const fa=P.people.find(p=>p.rel==='Father'),mo=P.people.find(p=>p.rel==='Mother');
  say(`${P.name} is born to ${mo.name} and ${fa.name}: a ${race().n} of the ${bl().n}, carrying ${magic().n} magic. Expected lifespan: about ${P.life} years.`);
  say(`Backstory: ${b.n}. Trait: ${trait().n}.`);
  save();
}
const race=()=>byId(RACES,S.P.race),bl=()=>byId(BLOODS,S.P.bl),magic=()=>byId(MAGICS,S.P.mag),trait=()=>byId(TRAITS,S.P.trait);
function say(t){const P=S.P;P.log.unshift(t);if(P.log.length>50)P.log.length=50}

/* ---- derived stats ---- */
function raceStage(){let s=0;RACE_XP.forEach(x=>{if(S.P.rxp>=x)s++});return s}
function bonusOf(src,k){return (src.m[k]||0)+(STK.includes(k)?(src.m.all||0):0)}
function mult(k){
  const P=S.P,r=race(),st=raceStage();
  let m=1;[r,bl(),trait()].forEach(s=>m*=1+bonusOf(s,k));
  const primary=(r.m[k]||0)>0||r.m.all>0||r.id==='human';
  m*=1+st*(.04+(primary?.06:0));
  m*=1+P.rank*.05;
  return Math.max(.2,m);
}
function eff(k){return S.P.raw[k]*mult(k)}
function effAll(){const o={};STK.forEach(k=>o[k]=eff(k));return o}
function xb(k){const P=S.P;return [race(),bl(),trait()].reduce((a,s)=>a+(s.m[k]||0),0)}
function learnMult(){return (1+xb('learn'))*(1+(S.lp.talent||0)*.1)*(A().train2?2:1)}
function goldMult(){return (1+xb('gold'))*(1+(S.lp.coin||0)*.15)*(A().gold2?2:1)}
function xpMult(){return 1+(S.lp.memory||0)*.15}
const gearB=s=>{const id=s==='w'?S.P.wpn:S.P.foc;const g=id&&byId(GEAR,id);return g?g.b:0};
function awaken(){const l=S.P.mlv;return 1+(l>=20?.4:0)+(l>=35?.4:0)}
function maxHp(e){e=e||effAll();return Math.round(80+e.vit*6+e.dur*2)}
function maxMp(e){e=e||effAll();return Math.round(40+e.mag+e.spr*1.5)}
function maxSt(e){e=e||effAll();return Math.round(60+e.spd*.5+e.vit*.5)}
function physA(e){e=e||effAll();return (5+e.str)*(1+gearB('w'))}
function magA(e){e=e||effAll();return (5+e.mag*.9+e.ctl*.4)*(1+gearB('f'))*awaken()}
function critC(){return .05+xb('crit')+.15*eff('int')/(eff('int')+30)}
function combatClass(){
  const e=effAll(),base=STK.reduce((a,k)=>a+e[k],0)/4;
  return Math.round(base*(1+gearB('w')*.25+gearB('f')*.25)+S.P.mlv*1.5);
}
function maxEnergy(){return 10+(S.lp.reserve||0)*2}
function energySec(){return 15/((1+(S.lp.reserve||0)*.1)*(A().speed?5:1))}
function useEnergy(n){if(S.P.energy<n){toast(`Not enough energy. ${n} needed.`);return false}S.P.energy-=n;return true}
function mxpNeed(){return Math.round(15*Math.pow(S.P.mlv,1.6))}
function addMxp(x){const P=S.P;P.mxp+=x*xpMult();while(P.mxp>=mxpNeed()){P.mxp-=mxpNeed();P.mlv++;
  const u=SK_UNLOCK.indexOf(P.mlv);if(u>=0)say(`Magic mastery ${P.mlv}: you learned ${magic().sk[u][0]}.`);
  if(P.mlv===20||P.mlv===35)say(`Magic mastery ${P.mlv}: your ${magic().n} awakens. Magic power +40%.`);}}
function addRxp(x){const P=S.P,b=raceStage();P.rxp+=x*xpMult();const a=raceStage();
  if(a>b)say(`Race stage ${a}: ${race().st.split('|')[a-1]}.`)}
function skillsUnlocked(){return SK_UNLOCK.filter(l=>S.P.mlv>=l).length}

/* ---- training ---- */
function trainGain(t,score){
  const P=S.P,g=GRADES.find(x=>score>=x[1]),tier=P.tier[t.id]||0,m=P.mast[t.id]||0;
  const gain=2.5*g[2]*TIERM[tier]*(1+m/100)*learnMult();
  return {g,gain,mast:g[3]*(A().train2?2:1)};
}
function applyTrain(t,score){
  const P=S.P,r=trainGain(t,score);
  P.raw[t.st]+=r.gain;P.mast[t.id]=Math.min(100,(P.mast[t.id]||0)+r.mast);
  let extra='';
  if(t.id==='balance'){const x=6*r.g[2]*(A().train2?2:1);addMxp(x);extra=`, +${Math.round(x*xpMult())} magic XP`}
  if(t.id==='meditate'){const x=4*r.g[2]*(A().train2?2:1);addRxp(x);extra=`, +${Math.round(x*xpMult())} race XP`}
  return {...r,txt:`Grade ${r.g[0]}: +${r.gain.toFixed(1)} ${STN[t.st]}, +${r.mast} mastery${extra}`};
}
function upgradeTier(id){const P=S.P,t=P.tier[id]||0;if(t>=5)return;const c=TIERC[t+1];if(P.gold<c)return;P.gold-=c;P.tier[id]=t+1}
function rite(score){
  const g=GRADES.find(x=>score>=x[1]),x=(12+raceStage()*6)*g[2]*(A().train2?2:1);addRxp(x);
  return `Grade ${g[0]}: +${Math.round(x*xpMult())} race XP`;
}
function jobLv(id){const n=(S.P.jobs||{})[id]||0;let l=0;JOBLV.forEach((x,i)=>{if(n>=x)l=i});return l}
function jobAge(j){return j.rank?16:AGE_WORK}
function jobOpen(j){return S.P.age>=jobAge(j)&&S.P.rank>=j.rank&&eff(j.st)>=j.req}
function jobPay(j){return Math.round((j.b+eff(j.st)*j.k)*(1+jobLv(j.id)*.12)*(1+S.P.rank*.1)*goldMult())}
function workJob(id){
  const P=S.P,j=byId(JOBS,id);if(!j||!jobOpen(j)||!useEnergy(1))return;
  P.jobs=P.jobs||{};const before=jobLv(id),g=jobPay(j),r=.3*learnMult();
  P.gold+=g;P.raw[j.st]+=r;P.jobs[id]=(P.jobs[id]||0)+1;
  let msg=`${j.n} shift: +${fmt(g)} gold, +${r.toFixed(1)} ${STN[j.st]}`;
  if(id==='apoth'&&Math.random()<.2){P.pot.hp=(P.pot.hp||0)+1;msg+=', +1 Healing Draught'}
  const after=jobLv(id);if(after>before){say(`Promoted to ${JOBT[after]} ${j.n}. Pay +12%.`);msg+=`. Promoted to ${JOBT[after]}!`}
  toast(msg);
}
function rest(){if(!useEnergy(2))return;const P=S.P;P.hp=Math.min(maxHp(),P.hp+maxHp()*.5);P.mp=Math.min(maxMp(),P.mp+maxMp()*.5);toast('You rest. HP and mana restored by 50%.')}
function healerCost(){return Math.round(10+combatClass()*.6)}
function healer(){const c=healerCost(),P=S.P;if(P.gold<c)return;P.gold-=c;P.hp=maxHp();P.mp=maxMp();toast('The healer restores you fully.')}
function drink(k){const P=S.P;if(!P.pot[k])return;P.pot[k]--;if(k==='hp')P.hp=Math.min(maxHp(),P.hp+maxHp()*.45);else P.mp=Math.min(maxMp(),P.mp+maxMp()*.5)}
function buyPot(k){const P=S.P,c=potCost();if(P.gold<c)return;P.gold-=c;P.pot[k]=(P.pot[k]||0)+1}
function potCost(){return Math.round(25+combatClass()*.4)}
function buyGear(id){const P=S.P,g=byId(GEAR,id);if(P.owned.includes(id)){if(g.s==='w')P.wpn=id;else P.foc=id;return}
  if(P.gold<g.c)return;P.gold-=g.c;P.owned.push(id);if(g.s==='w')P.wpn=id;else P.foc=id;say(`You acquire the ${g.n}.`)}
function buyLegacy(id){const u=byId(LEGACY,id),lv=S.lp[id]||0,c=u.c*(lv+1);if(lv>=u.max||S.merit<c)return;S.merit-=c;S.lp[id]=lv+1}

/* ---- rebirth ---- */
function rebirthMerit(){const P=S.P;return Math.floor(combatClass()/8+P.rank*8+Object.keys(P.bosses).length*10+P.mlv+raceStage()*3)}
function rebirth(){
  const m=recordLife();
  S.P=null;C=null;newFate();save();
  toast(`Life ended. +${m} Merit carried forward.`);
}

/* ---- time ---- */
function tick(dt){
  if(S.phase!=='play')return;
  const P=S.P,sp=A().speed?5:1;if(P.dead)return;
  if(P.energy<maxEnergy()){P.ectr+=dt;const s=energySec();while(P.ectr>=s&&P.energy<maxEnergy()){P.ectr-=s;P.energy++}}else P.ectr=0;
  if(!C){P.hp=Math.min(maxHp(),P.hp+maxHp()*.002*dt*sp);P.mp=Math.min(maxMp(),P.mp+maxMp()*.004*dt*sp)}
  const t=TRAIN.find(x=>x.st===P.drill);
  if(t&&!MG)P.raw[P.drill]+=.03*dt*sp*TIERM[P.tier[t.id]||0]*(1+(P.mast[t.id]||0)/100)*learnMult();
  P.gold+=RANKS[P.rank].sal*dt*goldMult();
}
function drillRate(){const P=S.P,t=TRAIN.find(x=>x.st===P.drill);return .03*60*(A().speed?5:1)*TIERM[P.tier[t.id]||0]*(1+(P.mast[t.id]||0)/100)*learnMult()}
function offline(){
  const dt=Math.min(8*3600,(Date.now()-S.last)/1000);
  if(dt<60||S.phase!=='play')return '';
  const P=S.P,g0=P.gold,r0=P.raw[P.drill];
  let left=dt*.5;while(left>0){const s=Math.min(60,left);tick(s);left-=s}
  return `Away ${Math.round(dt/60)} min: +${fmt(P.gold-g0)} gold, +${(P.raw[P.drill]-r0).toFixed(1)} ${STN[P.drill]}.`;
}
function save(){try{S.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===3){S=o;S.assist=S.assist||{};migrate();return true}}}catch(e){}return false}
function migrate(){
  if(S.fate&&!S.fate.gender)S.fate.gender='Male';
  const P=S.P;if(!P)return;
  if(P.age==null){P.age=ADULT;P.gender=P.gender||'Male';P.life=rollLife(P.race);P.gen=1;P.acts=4;P.dead=false;P.ev=null;makeFamily(P);P.people.forEach(p=>p.age+=ADULT)}
}
/* ===== LIFE SIM ===== */
const AGE_TRAIN=3,AGE_FIGHT=6,AGE_WORK=10,AGE_TRIAL=12,ADULT=18;
function rollLife(raceId){const r=byId(RACES,raceId);return Math.round(rnd(r.life[0],r.life[1]))}
function nameFor(g){
  const pool=g==='Female'?FNAMES:MNAMES,used=new Set();
  if(S&&S.P){used.add(S.P.name);(S.P.people||[]).forEach(p=>used.add(p.name))}
  if(S&&S.fate)used.add(S.fate.name);
  let n=pick(pool);for(let i=0;i<15&&used.has(n);i++)n=pick(pool);return n;
}
function stage(P){P=P||S.P;if(P.age>=Math.max(50,P.life*.8))return 'Elder';return P.age<AGE_TRAIN?'Infant':P.age<13?'Child':P.age<ADULT?'Teen':'Adult'}

/* ---- event helpers (used by EVENTS) ---- */
function R(k,n){const v=n*(1+xb('learn')*.5);S.P.raw[k]+=v;return `+${v.toFixed(1)} ${STN[k]}`}
function G(n){S.P.gold=Math.max(0,S.P.gold+Math.round(n*(n>0?goldMult():1)));return n>=0?`+${fmt(n*goldMult())} gold`:`-${fmt(-n)} gold`}
function X(n){addRxp(n);return `+${Math.round(n*xpMult())} race XP`}
function MX(n){addMxp(n);return `+${Math.round(n*xpMult())} magic XP`}
function MER(n){S.merit+=n;return `+${n} Merit`}
function bondAll(n){S.P.people.forEach(p=>{if(p.alive&&p.kind!=='rival')p.bond=Math.min(100,p.bond+n)})}

/* ---- people ---- */
function person(o){return Object.assign({id:Math.random().toString(36).slice(2,9),bond:Math.round(rnd(25,50)),alive:true},o)}
function relName(p){
  if(p.kind==='child')return p.gender==='Female'?'Daughter':'Son';
  if(p.kind==='spouse')return p.gender==='Female'?'Wife':'Husband';
  return p.rel||REL_KIND[p.kind];
}
function makeFamily(P){
  const r=P.race,rl=byId(RACES,r).life,avg=(rl[0]+rl[1])/2,out=P.people=[];
  ['Male','Female'].forEach(g=>out.push(person({kind:'family',rel:g==='Male'?'Father':'Mother',gender:g,name:nameFor(g),race:r,
    age:Math.round(avg*rnd(.22,.4)),life:rollLife(r),bond:Math.round(rnd(55,85))})));
  const sib=Math.floor(rnd(0,2.6));
  for(let i=0;i<sib;i++){const g=pick(['Male','Female']);out.push(person({kind:'family',rel:g==='Male'?'Brother':'Sister',gender:g,name:nameFor(g),race:r,age:Math.round(rnd(1,8)),life:rollLife(r),bond:Math.round(rnd(40,70))}))}
  return out;
}
function romanceGender(){const p=S.romance||'opposite';return p==='any'?pick(['Male','Female']):p==='opposite'?(S.P.gender==='Female'?'Male':'Female'):p}
function meet(kind){
  const P=S.P;
  if(kind==='romance'&&P.age<14)kind='friend';
  if(P.people.filter(p=>p.alive&&['friend','rival','mentor','romance'].includes(p.kind)).length>=10){
    const i=P.people.findIndex(p=>p.alive&&['friend','rival','mentor','romance'].includes(p.kind)&&p.bond<30);
    if(i>=0)P.people.splice(i,1);else return 'You hear about someone interesting, but your circle is already full.';
  }
  const g=kind==='romance'?romanceGender():pick(['Male','Female']);
  const sameRace=Math.random()<.7,r=sameRace?P.race:rollFrom(RACES);
  let age=Math.max(1,P.age+Math.round(rnd(-3,3)));
  if(kind==='mentor')age=P.age+Math.round(rnd(15,40));
  if(kind==='romance')age=Math.max(16,P.age+Math.round(rnd(-3,4)));
  const p=person({kind,gender:g,name:nameFor(g),race:r,age,life:rollLife(r),bond:kind==='rival'?Math.round(rnd(5,20)):kind==='romance'?Math.round(rnd(20,40)):Math.round(rnd(25,45))});
  if(kind==='mentor')p.st=pick(STK);
  if(kind==='romance'){p.bl=rollFrom(BLOODS);p.mag=rollFrom(MAGICS)}
  P.people.push(p);
  const what={friend:'a new friend',rival:'a rival',mentor:`a mentor skilled in ${STN[p.st]||''}`,romance:'someone who catches your eye'}[kind];
  return `You meet ${p.name}, ${what}.`;
}
function randomMeetKind(){const P=S.P;const r=Math.random();if(P.age>=16&&r<.25)return 'romance';if(r<.55)return 'friend';if(r<.75)return 'rival';return 'mentor'}
function socialize(){const P=S.P;if(P.acts<=0||P.age<4)return;P.acts--;toast(meet(randomMeetKind()));}
const giftCost=()=>Math.round(20+S.P.age*1.5);
function canChild(){
  const P=S.P,sp=P.people.find(p=>p.kind==='spouse'&&p.alive);
  return sp&&P.age>=ADULT&&P.age<P.life*.6&&sp.age<sp.life*.6&&P.people.filter(p=>p.kind==='child').length<8?sp:null;
}
function interact(id,a){
  const P=S.P,p=P.people.find(x=>x.id===id);if(!p||!p.alive)return;
  if(a==='duel'){startFight('rival',id);return}
  if(P.acts<=0){toast('No social actions left this year. Age up to refresh them.');return}
  let msg='';
  if(a==='time'){const b=Math.round(rnd(6,14));p.bond=Math.min(100,p.bond+b);msg=`You spend time with ${p.name}. Bond +${b}.`}
  else if(a==='gift'){const c=giftCost();if(P.gold<c)return toast(`A good gift costs ${c} gold.`);P.gold-=c;p.bond=Math.min(100,p.bond+20);msg=`${p.name} loves your gift. Bond +20.`}
  else if(a==='train'){const k=p.st||pick(STK),n=(p.kind==='mentor'?2.5:1)*learnMult()*(p.bond>=60?1.3:1);P.raw[k]+=n;p.bond=Math.min(100,p.bond+4);msg=`You train with ${p.name}. +${n.toFixed(1)} ${STN[k]}.`}
  else if(a==='date'){if(p.bond<40)return toast(`${p.name} needs a bond of 40 first.`);p.kind='partner';p.bond=Math.min(100,p.bond+10);msg=`${p.name} agrees to be your partner!`;say(`Age ${P.age}. You begin courting ${p.name}.`)}
  else if(a==='propose'){
    if(P.age<ADULT||p.bond<70)return toast('You need to be an adult with a bond of 70 or more.');
    if(Math.random()<p.bond/100+.1){p.kind='spouse';p.bond=Math.min(100,p.bond+15);msg=`${p.name} says yes! You are married.`;say(`Age ${P.age}. You marry ${p.name}.`)}

function ageUp(n){

    if(P.age===AGE_FIGHT)say(`Age ${P.age}. You may now spar and explore the nearby wilds.`);
    if(P.age===AGE_WORK)say(`Age ${P.age}. You are old enough to take on work.`);
    if(P.age===AGE_TRIAL)say(`Age ${P.age}. The Vigil now accepts you for trials, and bosses take notice.`);
    if(P.age===ADULT)say(`Age ${P.age}. You come of age.`);
    for(const p of P.people){
      if(!p.alive)continue;p.age++;
      if(!['child','spouse','partner'].includes(p.kind))p.bond=Math.max(0,p.bond-2);
      if(p.kind==='child'&&p.age===ADULT)say(`Age ${P.age}. Your ${relName(p).toLowerCase()} ${p.name} comes of age.`);
      if(p.age>=p.life&&Math.random()<.35){
        p.alive=false;say(`Age ${P.age}. Your ${relName(p).toLowerCase()} ${p.name} has died at ${p.age}.`);
        if(p.rel==='Father'||p.rel==='Mother'){const g=Math.round(50+P.age*3);P.gold+=g;say(`You inherit ${g} gold.`)}
      }
    }
    if(P.age>=5&&Math.random()<.15)say(`Age ${P.age}. ${meet(randomMeetKind())}`);
    if(P.age>=P.life&&(Math.random()<.3||P.age>=P.life*1.1)){die();break}
    if(n===1){
      const pool=EVENTS.map((e,j)=>j).filter(j=>P.age>=EVENTS[j].a[0]&&P.age<=EVENTS[j].a[1]);
      if(pool.length&&Math.random()<(P.age<=8?.75:.5))P.ev=pick(pool);

const dtxt=d=>d<0?`${-d} (critical!)`:`${d}`;
function act(a,arg){

  let line='';

  else if(a==='heavy'){if(p.st<25)return;p.st-=25;const d=hitFoe(physA(C.e),1.9,{heavy:true});line=d?`Heavy blow for ${dtxt(d)}.`:''}
  else if(a==='block'){if(p.st<8)return;p.st-=8;p.s.block=true;p.mp=Math.min(p.mmax,p.mp+p.mmax*.08);line='You raise your guard.'}

    else{const h=Math.round(p.mmax*.5);p.mp=Math.min(p.mmax,p.mp+h);line=`You drink a Mana Tonic. +${h} mana.`}}

    else if(ef==='shield'){const s=Math.round(M*sk[2]);p.s.shield=(p.s.shield||0)+s;line=`${sk[0]}: a ${s}-point shield surrounds you.`}

      if(ef==='stun'){if(f.boss&&Math.random()<.5)line+=` ${f.n} resists the stun.`;else{f.s.stun=true;line+=` ${f.n} is stunned!`}}

function hitPlayer(Aval,pow,magic){

  if(m.type==='timing'){m.n=3;m.sp=[.9,1.25,1.65];m.ph=Math.random()}
  if(m.type==='breath'){m.type='timing';m.n=4;m.sp=[.35,.42,.5,.58];m.ph=Math.random()}
  if(m.type==='react'){m.n=6;m.seq=Array.from({length:6},()=>pick(OBST));m.rs=performance.now()}
  if(m.type==='brace'){m.n=5;m.rs=performance.now()+500}
  if(m.type==='pace'||m.type==='balance'){m.v=.35;m.inz=0;m.dur=8;m.lt=performance.now()}
  if(m.type==='mash'){m.taps=0;m.dur=6}
  if(m.type==='memory'){m.n=3;m.seq=[];m.k=0;m.showing=true;m.shown=-1}
  renderMG();
  if(m.type==='memory')memRound();
  requestAnimationFrame(mgLoop);
}
function mgFinish(score){
  const m=MG;m.phase='done';m.score=clamp(score,0,1);
  m.res=m.t.id==='rite'?rite(m.score):applyTrain(m.t,m.score).txt;
  m.grade=GRADES.find(x=>m.score>=x[1]);
  save();renderMG();render();
}
const nowT=()=>(performance.now()-MG.t0)/1000;
function mgTap(v){
  const m=MG;if(!m||m.phase!=='play')return;
  const now=performance.now();
  if(m.type==='timing'){
    const x=pipX(),d=Math.abs(x-.5),s=d<.035?1:d<.1?.75:d<.2?.45:.1;
    m.sc.push(s);m.last=s>=1?'PERFECT':s>=.75?'GOOD':s>=.45?'OK':'MISS';m.i++;m.t0=now;m.ph=Math.random();
    if(m.i>=m.n)return mgFinish(avg(m.sc));
  }else if(m.type==='react'){
    if(now<m.rs)return;
    const w=1900-m.i*130,el=now-m.rs,ok=v===m.seq[m.i][1];
    m.sc.push(ok?.5+.5*Math.max(0,1-el/w):0);m.last=ok?'Clean!':`Wrong. It was ${m.seq[m.i][1]}.`;
    m.i++;m.rs=now+350;if(m.i>=m.n)return mgFinish(avg(m.sc));renderMG();
  }else if(m.type==='brace'){
    if(now<m.rs)return;
    const T=1500-m.i*150,f=(now-m.rs)/T,s=f>=.9&&f<=1?1:f>=.78?.7:f*.4;
    m.sc.push(s);m.last=s>=1?'PERFECT BRACE':s>=.7?'Good brace':'Too early';m.i++;m.rs=now+450;
    if(m.i>=m.n)return mgFinish(avg(m.sc));
  }else if(m.type==='pace'||m.type==='balance'){m.v=Math.min(1,m.v+.11)}
  else if(m.type==='mash'){m.taps++}
  else if(m.type==='memory'){
    if(m.showing)return;
    if(v===m.seq[m.k]){m.k++;if(m.k>=m.seq.length){m.sc.push(1);m.last='Correct!';nextMem()}}
    else{m.sc.push(m.k/m.seq.length);m.last=`Wrong. The sequence was ${m.seq.join(' ')}`;nextMem()}
    if(m.phase==='play')renderMG();
  }
  mgUpdate();
}
const avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);
function pipX(){const m=MG;return (Math.sin(2*Math.PI*(nowT()*m.sp[Math.min(m.i,m.n-1)]+m.ph))+1)/2}
function zoneC(){return MG.type==='balance'?.5+.28*Math.sin(nowT()*1.3):.61}
function zoneW(){return MG.type==='balance'?.24:.22}
function nextMem(){const m=MG;m.i++;m.showing=true;if(m.i>=m.n)return mgFinish(avg(m.sc));setTimeout(memRound,900)}
function memRound(){
  const m=MG;if(!m||m.phase!=='play')return;
  m.seq=Array.from({length:4+m.i},()=>pick(SYMS));m.k=0;m.showing=true;m.shown=-1;renderMG();
  m.seq.forEach((s,j)=>setTimeout(()=>{if(MG!==m)return;m.shown=j;mgUpdate()},350+j*650));
  setTimeout(()=>{if(MG!==m)return;m.showing=false;m.shown=-1;renderMG()},350+m.seq.length*650);
}
function mgLoop(){
  const m=MG;if(!m||m.phase!=='play')return;
  const now=performance.now();
  if(m.type==='react'&&now>m.rs&&now-m.rs>1900-m.i*130){m.sc.push(0);m.last=`Too slow. It needed ${m.seq[m.i][1]}.`;m.i++;m.rs=now+350;if(m.i>=m.n)return mgFinish(avg(m.sc));renderMG()}
  if(m.type==='brace'&&now>m.rs&&(now-m.rs)>1500-m.i*150){m.sc.push(0);m.last='You took the full hit!';m.i++;m.rs=now+450;if(m.i>=m.n)return mgFinish(avg(m.sc))}
  if(m.type==='pace'||m.type==='balance'){
    const dt=(now-m.lt)/1000;m.lt=now;
    m.v=clamp(m.v-(m.type==='pace'?.3:.36)*dt+(Math.random()-.5)*.02,0,1);
    if(Math.abs(m.v-zoneC())<zoneW()/2)m.inz+=dt;
    if(nowT()>=m.dur)return mgFinish(m.inz/(m.dur*.85));
  }
  if(m.type==='mash'&&nowT()>=m.dur)return mgFinish(m.taps/42);
  mgUpdate();requestAnimationFrame(mgLoop);
}

function vPeople(){
  const P=S.P,sp=canChild(),gc=giftCost(),noAct=P.acts<=0;
  const btn=(p,a,l,ok)=>`<button class="alt" data-a="ppl" data-v="${p.id}:${a}" ${ok===false||noAct&&a!=='duel'?'disabled':''} style="min-height:36px;padding:6px 8px;font-size:.72rem">${l}</button>`;
  const card=p=>{
    if(!p.alive)return `<div class="kv"><span>${p.name} <span class="dim sm">· ${relName(p)}</span></span><b class="dim sm">Died at ${p.age}</b></div>`;
    const b=[btn(p,'time','Spend time'),btn(p,'gift',`Gift ${gc}g`,P.gold>=gc)];
    if(p.kind!=='rival'&&P.age>=AGE_TRAIN)b.push(btn(p,'train',p.kind==='mentor'?'Learn':'Train together'));
    if(p.kind==='rival'&&P.age>=AGE_FIGHT)b.push(`<button data-a="ppl" data-v="${p.id}:duel" data-ce="1" style="min-height:36px;padding:6px 8px;font-size:.72rem">Duel · 1 energy</button>`);
    if(p.kind==='romance'&&P.age>=14)b.push(btn(p,'date','Ask out',p.bond>=40));
    if(p.kind==='partner')b.push(btn(p,'propose','Propose',P.age>=ADULT&&p.bond>=70));
    if(p.kind==='spouse'&&sp)b.push(btn(p,'child','Try for a child'));
    if(p.kind!=='family'&&p.kind!=='child')b.push(btn(p,'leave',p.kind==='spouse'?'Divorce':p.kind==='partner'?'Break up':'Drift apart'));
    const extra=p.kind==='child'?`<div class="sm">${rtag(byId(RACES,p.race))} · ${rtag(byId(BLOODS,p.bl))} · ${rtag(byId(MAGICS,p.mag))} · ${rtag(byId(TRAITS,p.trait))}</div>`
      :p.kind==='mentor'?`<div class="sm dim">Teaches ${STN[p.st]}</div>`:'';
    return `<div class="card" style="background:var(--panel2)"><div class="hrow"><b>${p.name}</b><span class="pill" style="color:var(--gold2)">${relName(p)}</span></div>
      <div class="sm dim">${p.gender} · ${byId(RACES,p.race).n} · Age ${p.age}</div>${extra}
      ${bar(p.kind==='rival'?'':'xp',p.bond,100,p.kind==='rival'?'Respect':'Bond')}<div class="btns" style="flex-wrap:wrap">${b.join('')}</div></div>`;
  };
  const groups=[['Spouse & partner',p=>p.kind==='spouse'||p.kind==='partner'],['Children',p=>p.kind==='child'],['Family',p=>p.kind==='family'],['Friends, rivals & others',p=>['friend','rival','mentor','romance'].includes(p.kind)]];
  return `<div class="col"><div class="card"><h2>People</h2>
    <div class="d">Social actions this year: <b class="num" style="color:var(--fg)">${P.acts}/4</b>. They refresh each time you age up. Bonds slowly fade if ignored.</div>
    <div class="btns"><button data-a="social" ${P.acts<=0||P.age<4?'disabled':''}>Socialize · meet someone</button></div>
    <div class="btns" style="align-items:center"><span class="sm" style="flex:0 0 auto">Romance with</span><select id="romp" aria-label="Romance preference">${[['opposite','Opposite gender'],['Male','Men'],['Female','Women'],['any','Everyone']].map(([v,l])=>`<option value="${v}" ${(S.romance||'opposite')===v?'selected':''}>${l}</option>`).join('')}</select></div>
    ${P.age<14?'<div class="sm dim">Romance opens at 14, marriage at 18.</div>':''}</div>
    ${groups.map(([n,f])=>{const l=P.people.filter(f);return l.length?`<h2 style="margin-top:4px">${n}</h2><div class="grid">${l.filter(p=>p.alive).map(card).join('')}</div>${l.some(p=>!p.alive)?`<div class="card">${l.filter(p=>!p.alive).map(card).join('')}</div>`:''}`:''}).join('')}
  </div>`;
}

/* ===== UI: OVERLAYS, EVENTS, BOOT ===== */
let toastT=null;

/* ---- combat ---- */
function vCombat(){
  const f=C.foe,p=C.p,P=S.P,sk=magic().sk,un=skillsUnlocked();
  const fc=[f.s.guard&&'Guarding',f.s.burn&&`Burning ${f.s.burn.t}`,f.s.stun&&'Stunned',f.s.weaken&&`Weakened ${f.s.weaken}`,f.phase===2&&'Frenzy'].filter(Boolean);
  const pc=[p.s.shield&&`Shield ${p.s.shield}`,p.s.evade&&'Evasive',p.s.counter&&'Counter ready',p.s.open&&'Opening +50%'].filter(Boolean);
  const chip=c=>`<span class="pill" style="color:var(--gold2)">${c}</span>`;
  let body;
  if(!C.over){
    const ab=(a,v,l,s,dis)=>`<button data-a="act" data-v="${a}${v!=null?':'+v:''}" ${dis?'disabled':''}>${l}<small>${s}</small></button>`;
    body=`<div class="acts">
    ${ab('strike',null,'Strike','+6 stamina')}${ab('heavy',null,'Heavy','25 stamina · breaks guard',p.st<25)}${ab('block',null,'Block','8 stamina · -70% physical',p.st<8)}
    ${ab('dodge',null,'Dodge','14 stamina · counter opening',p.st<14)}${ab('recover',null,'Recover','+40% stamina')}
    ${ab('pot','hp','Draught',`${P.pot.hp||0} left · +45% HP`,!P.pot.hp)}
    ${sk.map((s,i)=>i<un?`<button class="sk" data-a="act" data-v="skill:${i}" ${p.mp<skCost(i,p.mmax)?'disabled':''}>${s[0]}<small>${skCost(i,p.mmax)} mana · ${EFFN[s[3]]||'damage'}</small></button>`:'').join('')}
    ${ab('pot','mp','Tonic',`${P.pot.mp||0} left · +50% mana`,!P.pot.mp)}${ab('flee',null,'Flee',C.kind==='region'?'resets streak':'no reward')}
    </div>`;
  }else{
    const t=C.over==='win'?'Victory':C.over==='lose'?'Defeat':'Retreated';
    body=`<div class="grade" style="font-size:2rem;color:${C.over==='win'?'var(--gold2)':'var(--hp)'}">${t}</div>
    ${C.rew&&C.rew.length?`<div class="card">${C.rew.map(r=>`<div class="sm">◆ ${r}</div>`).join('')}</div>`:''}
    <div class="btns"><button class="alt" data-a="leave">Continue</button>${C.kind==='region'&&C.over==='win'?`<button data-a="again" data-ce="1">Explore again · 1</button>`:''}</div>`;
  }
  const warn=INTW[f.intent];
  return `<div class="unit"><div class="nm"><span>${f.n}</span><span class="cc num">CC ${f.cc}</span></div>
    ${bar('',f.hp,f.max,'HP')}<div class="chips">${fc.map(chip).join('')}</div>
    ${!C.over?`<div class="intent ${warn?'warn':''}">Next: ${INTN[f.intent]}${f.intent==='unleash'?' (block or dodge!)':''}</div>`:''}</div>
  <div class="unit"><div class="nm"><span>${P.name}</span><span class="cc num">CC ${combatClass()}</span></div>
    ${bar('',p.hp,p.max,'HP')}${bar('mp',p.mp,p.mmax,'Mana')}${bar('st',p.st,p.smax,'Stamina')}<div class="chips">${pc.map(chip).join('')}</div></div>
  ${body}
  <div class="clog">${C.log.slice(0,8).map(l=>`<p>${l}</p>`).join('')}</div>`;
}

  if(m.type==='react')g=`<div class="bar st"><i id="mgFill"></i></div><div class="syms" style="grid-template-columns:1fr 1fr">${MOVES.map(x=>`<button data-a="mg" data-v="${x}">${x}</button>`).join('')}</div>`;
  if(m.type==='brace')g=`<div class="meter"><div class="zone" style="left:78%;width:22%"></div><div class="zone p" style="left:90%;width:10%"></div><div class="pip" id="mgPip"></div></div>

  if(m.type==='mash')g=`<div class="bar mp"><i id="mgFill"></i></div><button class="big" data-a="mg" data-v="tap" style="min-height:96px;font-size:1.4rem">Charge</button>`;
  if(m.type==='memory')g=`<div class="syms">${SYMS.map(s=>`<button data-a="mg" data-v="${s}" ${m.showing?'disabled':''}>${s}</button>`).join('')}</div>`;
  return `<h2>${t.n}</h2><div class="d">${t.d||'Strike when the marker is centred. Three swings.'}</div>
    <div class="mgbig" id="mgBig"></div><div class="sm dim" style="text-align:center" id="mgInfo"></div>${g}
    <div class="sm" style="text-align:center;min-height:1.2em;color:var(--gold2)" id="mgLast"></div>`;
}
function mgUpdate(){
  const m=MG;if(!m||m.phase!=='play'||!$('mgInfo'))return;
  const now=performance.now(),pip=$('mgPip'),fill=$('mgFill');
  $('mgLast').textContent=m.last||'';
  if(m.type==='timing'){pip.style.left=pipX()*100+'%';$('mgInfo').textContent=`${m.t.id==='meditate'?'Breath':'Swing'} ${m.i+1} of ${m.n}`}
  if(m.type==='react'){
    const w=1900-m.i*130,ready=now>=m.rs;
    $('mgBig').textContent=ready?m.seq[m.i][0]:'...';
    fill.style.width=ready?Math.max(0,100-(now-m.rs)/w*100)+'%':'100%';
    $('mgInfo').textContent=`Obstacle ${m.i+1} of ${m.n}`;
  }
  if(m.type==='brace'){const T=1500-m.i*150;pip.style.left=(now<m.rs?0:clamp((now-m.rs)/T,0,1)*100)+'%';$('mgInfo').textContent=`Incoming blow ${m.i+1} of ${m.n}`}
  if(m.type==='pace'||m.type==='balance'){
    const z=$('mgZone'),c=zoneC(),w=zoneW();z.style.left=(c-w/2)*100+'%';z.style.width=w*100+'%';pip.style.left=m.v*100+'%';
    $('mgInfo').textContent=`${Math.max(0,m.dur-nowT()).toFixed(1)}s left · in zone ${m.inz.toFixed(1)}s`;
  }
  if(m.type==='mash'){$('mgBig').textContent=m.taps;fill.style.width=Math.min(100,m.taps/42*100)+'%';$('mgInfo').textContent=`${Math.max(0,m.dur-nowT()).toFixed(1)}s left · 42 taps for top grade`}
  if(m.type==='memory'){
    $('mgInfo').textContent=`Round ${m.i+1} of ${m.n}`;
    $('mgBig').textContent=m.showing?(m.shown>=0?m.seq[m.shown]:'Watch...'):`${'●'.repeat(m.k)}${'○'.repeat(m.seq.length-m.k)}`;
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;

    case 'gender':S.fate.gender=v;break;
    case 'age':ageUp(S.ageX||1);break;
    case 'agex':S.ageX={1:5,5:10,10:1}[S.ageX||1];toast(`+ Age now advances ${S.ageX} year${S.ageX>1?'s':''}. Multi-year skips grow your stats but skip yearly events.`);break;
    case 'evc':resolveEvent(+v);break;
    case 'heir':continueAs(v);tab='you';break;
    case 'newlife':rebirth();ctab='race';break;
    case 'social':socialize();break;
    case 'ppl':{const [id,k]=v.split(':');interact(id,k);break}
    case 'modal':modal=v;break;
    case 'close':modal=null;break;
    case 'exact':chooseExact(ctab,v);modal=null;flashCat=ctab;break;
    case 'begin':modal=null;beginLife(v);break;
    case 'leg':buyLegacy(v);break;
    case 'train':MG=null;startTrain(v);break;
    case 'mgclose':MG=null;break;
    case 'tier':upgradeTier(v);break;
    case 'work':workJob(v);break;
    case 'rest':rest();break;
    case 'healer':healer();break;
    case 'drink':drink(v);break;
    case 'pot':buyPot(v);break;
    case 'gear':buyGear(v);break;
    case 'fight':{const [k,r]=v.split(':');startFight(k,r);break}
    case 'act':{const [k,r]=v.split(':');act(k,k==='skill'?+r:r);break}
    case 'leave':C=null;break;
    case 'again':{const r=C.ref;C=null;startFight('region',r);break}
    case 'rebirth':modal='reb';break;
    case 'dorebirth':modal=null;rebirth();ctab='race';break;
    case 'assist':S.assist[v]=!S.assist[v];break;
    case 'exp':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('sv').value=code;$('sv').select();
      try{navigator.clipboard.writeText(code).then(()=>$('svMsg').textContent='Copied to clipboard.').catch(()=>{$('svMsg').textContent='Select the code and copy it.'})}catch(x){$('svMsg').textContent='Select the code and copy it.'}
      return}
    case 'imp':try{const o=JSON.parse(decodeURIComponent(escape(atob($('sv').value.trim()))));if(!o||o.v!==3)throw 0;S=o;S.assist=S.assist||{};C=null;MG=null;modal=null;save()}catch(x){$('svMsg').textContent='That code did not work. Check it was copied in full.';return}break;
    case 'reset':if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to erase everything';return}
      try{localStorage.removeItem(KEY)}catch(x){}freshSave();C=null;MG=null;modal=null;tab='you';break;
  }
  save();render();
});
function boot(){
  if(!load())freshSave();
  const msg=offline();
  render();if(msg)toast(msg);
  let last=performance.now();
  setInterval(()=>{const n=performance.now(),dt=Math.min(5,(n-last)/1000);last=n;tick(dt);hudLive();
    const te=$('tE');if(te&&S.P)te.textContent=`Energy ${S.P.energy}/${maxEnergy()}`;const we=$('wE');if(we&&S.P)we.textContent=`${S.P.energy}/${maxEnergy()}`},250);
  setInterval(save,10000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
}
boot();
</script>
